                    ${website ? `<div><span class="text-muted">Website:</span> <a href="${escapeHTML(website)}" target="_blank" rel="noopener" style="color:var(--blue)">${escapeHTML(website)}</a></div>` : ''}
                    ${mapsLink ? `<div><span class="text-muted">Maps:</span> <a href="${escapeHTML(mapsLink)}" target="_blank" rel="noopener" style="color:var(--blue)">Open Maps</a></div>` : ''}
                    ${description ? `<div style="grid-column:span 2"><span class="text-muted">Description:</span> ${escapeHTML(description)}</div>` : ''}
                </div>
            </div>
        </div>
    `;
}

/* ============================================================
   MAIN APP CONTROLLER
   ============================================================ */
const App = {
    navigate(page) {
        state.currentPage = page;
        state.currentPageNum = 1;
        state.selectedLeadIds.clear();
        window.scrollTo(0, 0);
        this.render();
        document.querySelectorAll('.mobile-nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.page === page);
        });
    },

    render() {
        const app = document.getElementById('app');
        switch (state.currentPage) {
            case 'overview': app.innerHTML = renderOverview(); break;
            case 'leads': app.innerHTML = renderLeadsPage(); break;
            case 'analytics': app.innerHTML = renderAnalyticsPage(); initCharts(); break;
            case 'followups': app.innerHTML = renderFollowupsPage(); break;
            case 'settings': app.innerHTML = renderSettingsPage(); break;
            default: app.innerHTML = renderOverview();
        }
    },

    renderDrawer() {
        const lead = state.leads.find(l => l.id === state.leadDetailId);
        if (lead) {
            openDrawer(getLeadDisplayName(lead), renderLeadDetail(lead));
        }
    },

    openLead(id) {
        state.leadDetailId = id;
        const lead = state.leads.find(l => l.id === id);
        if (lead) {
            openDrawer(getLeadDisplayName(lead), renderLeadDetail(lead));
        }
    },

    onSearch(query) {
        state.searchQuery = query;
        state.currentPageNum = 1;
        this.render();
    },

    setStatusFilter(filter) {
        state.statusFilter = filter;
        state.currentPageNum = 1;
        this.render();
    },

    setPriorityFilter(filter) {
        state.priorityFilter = filter;
        state.currentPageNum = 1;
        this.render();
    },

    setWebsiteFilter(filter) {
        state.websiteFilter = filter;
        state.currentPageNum = 1;
        this.render();
    },

    setRatingFilter(filter) {
        state.ratingFilter = filter;
        state.currentPageNum = 1;
        this.render();
    },

    setSort(sortField) {
        state.sortField = sortField;
        this.render();
    },

    setPeriod(period) {
        state.analyticsPeriod = period;
        this.render();
    },

    goToPage(page) {
        state.currentPageNum = page;
        this.render();
    },

    toggleSelect(id, checked) {
        if (checked) state.selectedLeadIds.add(id);
        else state.selectedLeadIds.delete(id);
        this.render();
    },

    toggleSelectAll(checked) {
        const filtered = getFilteredLeads();
        const start = (state.currentPageNum - 1) * PAGE_SIZE;
        const pageLeads = filtered.slice(start, start + PAGE_SIZE);
        for (const lead of pageLeads) {
            if (checked) state.selectedLeadIds.add(lead.id);
            else state.selectedLeadIds.delete(lead.id);
        }
        this.render();
    },

    callNextLead() {
        const uncalled = state.leads.filter(l => l.crm_status === 'NOT_CALLED');
        if (uncalled.length === 0) {
            showToast('No uncalled leads remaining!', 'info');
            return;
        }
        const priorityOrder = { 'HOT': 0, 'HIGH': 1, 'MEDIUM': 2, 'LOW': 3 };
        uncalled.sort((a, b) => (priorityOrder[a.priority] || 9) - (priorityOrder[b.priority] || 9));
        const next = uncalled[0];
        this.openLead(next.id);
    },

    showCloseDealModal(leadId) {
        const lead = state.leads.find(l => l.id === leadId);
        if (!lead) return;
        const defaultVal = lead.deal_value || state.settings.defaultDealValue;
        showModal(`
            <div class="modal-header">
                <h3 class="modal-title">Close Deal</h3>
                <button class="modal-close" onclick="closeModal(false)">${svgIcon('x', 16)}</button>
            </div>
            <div class="modal-body">
                <p style="margin:0 0 16px;color:var(--text-secondary)">Closing deal with <strong style="color:var(--text)">${escapeHTML(getLeadDisplayName(lead))}</strong></p>
                <div class="form-group">
                    <label class="form-label">Deal Value (${state.settings.currency})</label>
                    <input type="number" class="form-input" id="dealValueInput" value="${defaultVal}" min="0" />
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal(false)">Cancel</button>
                <button class="btn btn-success" onclick="const val=parseInt(document.getElementById('dealValueInput').value)||${state.settings.defaultDealValue};closeDeal('${leadId}', val);closeModal(true)">Close Deal</button>
            </div>
        `);
    },

    showClearConfirm() {
        showModal(`
            <div class="modal-header">
                <h3 class="modal-title">Clear Workspace</h3>
                <button class="modal-close" onclick="closeModal(false)">${svgIcon('x', 16)}</button>
            </div>
            <div class="modal-body">
                <div class="confirm-icon danger">${svgIcon('trash', 24)}</div>
                <p style="margin:0 0 8px;font-weight:600">This will permanently delete all leads, CRM data, and settings.</p>
                <p style="margin:0;color:var(--text-secondary);font-size:13px">This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal(false)">Cancel</button>
                <button class="btn btn-danger" onclick="clearAll();closeModal(true)">Clear Everything</button>
            </div>
        `).then(confirmed => {
            if (confirmed) {
                clearAll();
            }
        });
    },

    updateSetting(key, value) {
        state.settings[key] = value;
        saveToDB().then(() => {
            showToast('Settings saved', 'success');
            this.render();
        });
    }
};

/* ============================================================
   CHART INITIALIZATION
   ============================================================ */
function initCharts() {
    const dailyData = getDailyAnalytics();
    if (!dailyData.length) return;
    const labels = dailyData.map(d => {
        const date = new Date(d.date + 'T00:00:00');
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }).reverse();
    const callsData = dailyData.map(d => d.calls || 0).reverse();
    const revenueData = dailyData.map(d => d.revenue || 0).reverse();
    const dealsData = dailyData.map(d => d.closedDeals || 0).reverse();
    const interestedData = dailyData.map(d => d.interested || 0).reverse();

    const chartDefaults = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: { display: false },
            tooltip: {
                backgroundColor: 'rgba(14,18,30,0.9)',
                titleColor: '#f0f3ff',
                bodyColor: '#8b95b0',
                borderColor: 'rgba(255,255,255,0.1)',
                borderWidth: 1,
                cornerRadius: 8,
                padding: 10
            }
        },
        scales: {
            x: {
                grid: { color: 'rgba(255,255,255,0.04)' },
                ticks: { color: '#8b95b0', font: { size: 10 } }
            },
            y: {
                grid: { color: 'rgba(255,255,255,0.04)' },
                ticks: { color: '#8b95b0', font: { size: 10 } },
                beginAtZero: true
            }
        }
    };

    if (state.charts.callsChart) state.charts.callsChart.destroy();
    if (state.charts.revenueChart) state.charts.revenueChart.destroy();
    if (state.charts.dealsChart) state.charts.dealsChart.destroy();
    if (state.charts.funnelChart) state.charts.funnelChart.destroy();

    const callsCtx = document.getElementById('callsChart');
    if (callsCtx) {
        state.charts.callsChart = new Chart(callsCtx, {
            type: 'bar',
            data: { labels, datasets: [{ label: 'Calls', data: callsData, backgroundColor: 'rgba(91,124,255,0.6)', borderRadius: 4 }] },
            options: chartDefaults
        });
    }
    const revenueCtx = document.getElementById('revenueChart');
    if (revenueCtx) {
        state.charts.revenueChart = new Chart(revenueCtx, {
            type: 'bar',
            data: { labels, datasets: [{ label: 'Revenue', data: revenueData, backgroundColor: 'rgba(79,209,197,0.6)', borderRadius: 4 }] },
            options: chartDefaults
        });
    }
    const dealsCtx = document.getElementById('dealsChart');
    if (dealsCtx) {
        state.charts.dealsChart = new Chart(dealsCtx, {
            type: 'line',
            data: { labels, datasets: [{ label: 'Deals', data: dealsData, borderColor: 'rgba(52,211,153,0.8)', backgroundColor: 'rgba(52,211,153,0.1)', fill: true, tension: 0.3, pointRadius: 3 }] },
            options: chartDefaults
        });
    }
    const funnelCtx = document.getElementById('funnelChart');
    if (funnelCtx) {
        const analytics = getAnalytics();
        state.charts.funnelChart = new Chart(funnelCtx, {
            type: 'bar',
            data: {
                labels: ['Total', 'Called', 'Interested', 'Follow Ups', 'Closed'],
                datasets: [{ data: [analytics.total, analytics.called, analytics.interested, analytics.followUps, analytics.closedDeals], backgroundColor: ['rgba(91,124,255,0.6)','rgba(79,209,197,0.6)','rgba(52,211,153,0.6)','rgba(251,191,36,0.6)','rgba(79,209,197,0.8)'], borderRadius: 4 }]
            },
            options: { ...chartDefaults, indexAxis: 'y' }
        });
    }
}

/* ============================================================
   IMPORT HANDLERS
   ============================================================ */
let importMode = 'replace';

function showImportOptions(merge = false) {
    importMode = merge ? 'merge' : 'replace';
    document.getElementById('fileInput')?.click();
}

async function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (state.leads.length > 0 && !confirm(`Import mode: ${importMode === 'merge' ? 'Merge with existing leads' : 'Replace existing workspace'}. Continue?`)) {
        event.target.value = '';
        return;
    }
    await handleFileImport(file, importMode === 'merge');
    event.target.value = '';
}

async function handleDrop(event) {
    const file = event.dataTransfer.files[0];
    if (!file) return;
    if (state.leads.length > 0 && !confirm(`Import mode: ${importMode === 'merge' ? 'Merge with existing leads' : 'Replace existing workspace'}. Continue?`)) {
        return;
    }
    await handleFileImport(file, importMode === 'merge');
}

/* ============================================================
   CLEAR ALL
   ============================================================ */
async function clearAll() {
    state.leads = [];
    state.settings = { ...DEFAULT_SETTINGS };
    state.dailyActivity = {};
    state.sourceColumns = [];
    state.selectedLeadIds.clear();
    state.importStats = null;
    await saveToDB();
    App.render();
    showToast('Workspace cleared', 'success');
}

/* ============================================================
   INITIALIZATION
   ============================================================ */
async function init() {
    await loadFromDB();
    if (state.settings.defaultSort) {
        state.sortField = state.settings.defaultSort;
    }
    App.render();
    setupDragDrop();
}

function setupDragDrop() {
    document.addEventListener('dragover', (e) => {
        const dropzone = document.getElementById('dropzone');
        if (dropzone && dropzone.contains(e.target)) {
            e.preventDefault();
            dropzone.classList.add('dragover');
        }
    });
    document.addEventListener('dragleave', (e) => {
        const dropzone = document.getElementById('dropzone');
        if (dropzone && !dropzone.contains(e.relatedTarget)) {
            dropzone.classList.remove('dragover');
        }
    });
    document.addEventListener('drop', (e) => {
        const dropzone = document.getElementById('dropzone');
        if (dropzone && dropzone.contains(e.target)) {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFileImport(file, importMode === 'merge');
        }
    });
}

const originalRender = App.render.bind(App);
App.render = function() {
    originalRender();
    setupDragDrop();
};

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closeDrawer();
        closeModal(false);
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        App.navigate('leads');
        setTimeout(() => document.getElementById('searchInput')?.focus(), 100);
    }
});

init();
</script>
