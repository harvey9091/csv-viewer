<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LeadFlow â€” Premium Lead Calling Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
    --bg: #06080f;
    --panel: rgba(14, 18, 30, 0.82);
    --panel-solid: #0e121e;
    --panel-2: rgba(20, 26, 42, 0.92);
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.14);
    --text: #f0f3ff;
    --text-secondary: #8b95b0;
    --blue: #5b7cff;
    --blue-2: #3155e7;
    --cyan: #4fd1c5;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --orange: #fb923c;
    --shadow: 0 24px 80px rgba(0,0,0,0.35);
    --shadow-sm: 0 4px 16px rgba(0,0,0,0.2);
    --radius: 14px;
    --radius-sm: 10px;
    --transition: 0.18s ease;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    padding-top: 12px;
}
::selection { background: rgba(91,124,255,0.3); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }

/* ---------- APP ---------- */
.app {
    max-width: 1440px;
    margin: 0 auto;
    padding: 36px 28px 80px;
}
@media (max-width: 768px) {
    .app { padding: 28px 14px 100px; }
}

/* ---------- HEADER ---------- */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    margin-bottom: 36px;
    flex-wrap: wrap;
}
.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}
.logo {
    width: 44px;
    height: 44px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: 18px;
    color: white;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    box-shadow: 0 10px 30px rgba(49,85,231,0.3);
    flex-shrink: 0;
}
.brand h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: -0.5px;
    font-weight: 800;
}
.brand p {
    margin: 2px 0 0;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
}
.header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}
.nav-pills {
    display: flex;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
}
.nav-pill {
    border: 0;
    background: transparent;
    color: var(--text-secondary);
    padding: 8px 14px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
}
.nav-pill:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.nav-pill.active {
    background: rgba(91,124,255,0.15);
    color: var(--blue);
    box-shadow: 0 0 0 1px rgba(91,124,255,0.2);
}

/* ---------- BUTTONS ---------- */
button { font: inherit; cursor: pointer; border: 0; outline: none; }
.btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    transition: var(--transition);
    cursor: pointer;
    white-space: nowrap;
}
.btn:hover { background: rgba(255,255,255,0.08); border-color: var(--border-hover); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary {
    background: linear-gradient(135deg, var(--blue-2), var(--blue));
    color: white;
    border: 0;
    box-shadow: 0 8px 24px rgba(49,85,231,0.25);
}
.btn-primary:hover { filter: brightness(1.1); }
.btn-success {
    background: rgba(52,211,153,0.12);
    color: var(--green);
    border: 1px solid rgba(52,211,153,0.2);
}
.btn-success:hover { background: rgba(52,211,153,0.2); }
.btn-danger {
    background: rgba(248,113,113,0.1);
    color: var(--red);
    border: 1px solid rgba(248,113,113,0.2);
}
.btn-danger:hover { background: rgba(248,113,113,0.18); }
.btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 8px; }
.btn-xs { padding: 5px 10px; font-size: 11px; border-radius: 7px; }
.btn-icon {
    width: 34px;
    height: 34px;
    padding: 0;
    display: inline-grid;
    place-items: center;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--text-secondary);
}
.btn-icon:hover { background: rgba(255,255,255,0.07); color: var(--text); }
.btn-icon svg { width: 16px; height: 16px; }

/* ---------- DROPZONE ---------- */
.dropzone {
    border: 1.5px dashed rgba(91,124,255,0.35);
    background: linear-gradient(135deg, rgba(49,85,231,0.06), rgba(79,209,197,0.03));
    border-radius: 18px;
    padding: 36px;
    text-align: center;
    transition: 0.2s;
    margin-bottom: 28px;
    position: relative;
}
.dropzone.dragover {
    border-color: var(--cyan);
    background: rgba(79,209,197,0.06);
    transform: scale(1.005);
}
.drop-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 14px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: rgba(91,124,255,0.1);
    color: var(--blue);
}
.dropzone h2 { margin: 0; font-size: 16px; font-weight: 700; }
.dropzone p { margin: 6px 0 16px; color: var(--text-secondary); font-size: 13px; }
.file-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: white;
    color: #0a0e18;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: 0.15s;
}
.file-label:hover { filter: brightness(0.95); }
#fileInput { display: none; }
.import-stats {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
    justify-content: center;
}
.import-stat {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
}
.import-stat.success { color: var(--green); border-color: rgba(52,211,153,0.2); }
.import-stat.warning { color: var(--yellow); border-color: rgba(251,191,36,0.2); }
.import-stat.info { color: var(--blue); border-color: rgba(91,124,255,0.2); }

/* ---------- KPI CARDS ---------- */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
}
@media (max-width: 1024px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .kpi-grid { grid-template-columns: 1fr; } }
.kpi-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}
.kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent, var(--blue)), transparent);
    opacity: 0;
    transition: 0.3s;
}
.kpi-card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.kpi-card:hover::before { opacity: 1; }
.kpi-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}
.kpi-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 18px;
}
.kpi-icon svg { width: 18px; height: 18px; }
.kpi-value {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.8px;
    line-height: 1;
}
.kpi-label {
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 6px;
}
.kpi-meta {
    color: var(--text-secondary);
    font-size: 11px;
    margin-top: 6px;
    font-weight: 500;
}
.kpi-card.accent-blue .kpi-icon { background: rgba(91,124,255,0.12); color: var(--blue); }
.kpi-card.accent-blue .kpi-value { color: var(--blue); }
.kpi-card.accent-cyan .kpi-icon { background: rgba(79,209,197,0.12); color: var(--cyan); }
.kpi-card.accent-cyan .kpi-value { color: var(--cyan); }
.kpi-card.accent-green .kpi-icon { background: rgba(52,211,153,0.12); color: var(--green); }
.kpi-card.accent-green .kpi-value { color: var(--green); }
.kpi-card.accent-red .kpi-icon { background: rgba(248,113,113,0.12); color: var(--red); }
.kpi-card.accent-red .kpi-value { color: var(--red); }
.kpi-card.accent-yellow .kpi-icon { background: rgba(251,191,36,0.12); color: var(--yellow); }
.kpi-card.accent-yellow .kpi-value { color: var(--yellow); }
.kpi-card.accent-orange .kpi-icon { background: rgba(251,146,60,0.12); color: var(--orange); }
.kpi-card.accent-orange .kpi-value { color: var(--orange); }

/* ---------- SECTIONS ---------- */
.section { margin-bottom: 28px; }
.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
}
.section-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
}
.section-title svg { width: 18px; height: 18px; }

/* ---------- DAILY GOAL ---------- */
.daily-goal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 28px;
}
.daily-goal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}
.daily-goal-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
}
.daily-goal-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--blue);
}
.daily-goal-track {
    height: 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 10px;
}
.daily-goal-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    border-radius: 5px;
    transition: width 0.5s ease;
}
.daily-goal-stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}
.daily-goal-stat {
    font-size: 12px;
    color: var(--text-secondary);
}
.daily-goal-stat strong {
    color: var(--text);
    font-weight: 700;
}

/* ---------- FUNNEL ---------- */
.funnel {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.funnel-step {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    transition: var(--transition);
    cursor: default;
}
.funnel-step:hover { background: rgba(255,255,255,0.04); border-color: var(--border-hover); }
.funnel-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
.funnel-value {
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
}
.funnel-bar {
    height: 4px;
    border-radius: 2px;
    margin-top: 6px;
    background: rgba(255,255,255,0.05);
    overflow: hidden;
}
.funnel-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    transition: width 0.5s ease;
}

/* ---------- TOOLBAR ---------- */
.toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.search {
    position: relative;
    flex: 1;
    min-width: 220px;
}
.search svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    width: 16px;
    height: 16px;
    pointer-events: none;
}
.search input {
    width: 100%;
    padding: 11px 14px 11px 40px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    outline: none;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
    transition: var(--transition);
}
.search input:focus { border-color: rgba(91,124,255,0.5); box-shadow: 0 0 0 3px rgba(91,124,255,0.08); }
.search input::placeholder { color: var(--text-secondary); }
.filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}
.filter-pill {
    padding: 8px 14px;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--text-secondary);
    transition: var(--transition);
    cursor: pointer;
    white-space: nowrap;
}
.filter-pill:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.filter-pill.active {
    background: rgba(91,124,255,0.12);
    color: var(--blue);
    border-color: rgba(91,124,255,0.25);
}
.sort-select {
    padding: 9px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    outline: none;
}
.sort-select:focus { border-color: rgba(91,124,255,0.4); }

/* ---------- TABLE ---------- */
.table-wrap {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: rgba(10,14,24,0.6);
}
.table-scroll { overflow-x: auto; }
table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1000px;
}
thead {
    background: rgba(255,255,255,0.02);
    position: sticky;
    top: 0;
    z-index: 2;
}
th {
    text-align: left;
    padding: 14px 18px;
    color: #737e98;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: color 0.15s;
}
th:hover { color: var(--text); }
th .sort-indicator { margin-left: 4px; opacity: 0.5; }
th.sorted .sort-indicator { opacity: 1; color: var(--blue); }
td {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 13px;
    vertical-align: middle;
}
tbody tr { transition: 0.12s ease; }
tbody tr:hover { background: rgba(255,255,255,0.025); }
tbody tr.selected { background: rgba(91,124,255,0.06); }
tbody tr:last-child td { border-bottom: 0; }

/* ---------- LEAD ROW ---------- */
.lead-cell {
    display: flex;
    align-items: center;
    gap: 12px;
}
.lead-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: rgba(255,255,255,0.05);
}
.lead-avatar-fallback {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 14px;
    color: white;
    flex-shrink: 0;
}
.lead-name {
    font-weight: 700;
    color: white;
    font-size: 13px;
    line-height: 1.3;
}
.lead-category {
    color: var(--text-secondary);
    font-size: 11px;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
}
.rating-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--yellow);
}
.rating-badge svg { width: 14px; height: 14px; }
.phone-text {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #cbd4ec;
    font-size: 12px;
}
.priority-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.priority-hot { background: rgba(248,113,113,0.12); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
.priority-high { background: rgba(251,146,60,0.12); color: var(--orange); border: 1px solid rgba(251,146,60,0.2); }
.priority-medium { background: rgba(91,124,255,0.12); color: var(--blue); border: 1px solid rgba(91,124,255,0.2); }
.priority-low { background: rgba(255,255,255,0.05); color: var(--text-secondary); border: 1px solid var(--border); }
.status-pill {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.status-not-called { background: rgba(255,255,255,0.05); color: var(--text-secondary); }
.status-called { background: rgba(91,124,255,0.12); color: var(--blue); }
.status-interested { background: rgba(52,211,153,0.12); color: var(--green); }
.status-not-interested { background: rgba(248,113,113,0.1); color: var(--red); }
.status-follow-up { background: rgba(251,191,36,0.12); color: var(--yellow); }
.status-closed-deal { background: rgba(79,209,197,0.12); color: var(--cyan); border: 1px solid rgba(79,209,197,0.2); }

/* ---------- FOOTER / PAGINATION ---------- */
.table-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    color: var(--text-secondary);
    font-size: 12px;
    border-top: 1px solid var(--border);
}
.pagination {
    display: flex;
    gap: 4px;
}
.page-btn {
    min-width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    display: inline-grid;
    place-items: center;
    padding: 0 8px;
    transition: var(--transition);
}
.page-btn:hover:not(:disabled) { background: rgba(255,255,255,0.07); color: var(--text); }
.page-btn.active { background: var(--blue-2); color: white; border-color: transparent; }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ---------- BULK BAR ---------- */
.bulk-bar {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: rgba(91,124,255,0.08);
    border: 1px solid rgba(91,124,255,0.2);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    font-size: 13px;
    font-weight: 600;
}
.bulk-bar.show { display: flex; }
.bulk-bar .btn { padding: 6px 12px; font-size: 12px; }

/* ---------- MODAL ---------- */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
}
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    max-width: 480px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    transform: scale(0.95) translateY(10px);
    transition: transform 0.25s ease;
}
.modal-overlay.show .modal { transform: scale(1) translateY(0); }
.modal-header {
    display: flex;
    align-items: center;

<script>
/* ============================================================
   CONSTANTS
   ============================================================ */
const CRM_COLUMNS = [
    'crm_status','call_count','last_called_at','follow_up_date',
    'notes','deal_value','deal_closed_at','assigned_to','priority','custom_tags'
];
const STATUSES = ['NOT_CALLED','CALLED','INTERESTED','NOT_INTERESTED','FOLLOW_UP','CLOSED_DEAL'];
const PRIORITIES = ['LOW','MEDIUM','HIGH','HOT'];
const DEFAULT_SETTINGS = {
    dailyGoal: 100,
    defaultDealValue: 8000,
    currency: 'INR',
    confirmBeforeCloseDeal: true,
    autoSave: true,
    defaultSort: 'priority-desc'
};
const PAGE_SIZE = 50;

/* ============================================================
   INDEXED DB
   ============================================================ */
const DB_NAME = 'leadflow_db';
const DB_VERSION = 1;
let dbInstance = null;

function openDB() {
    return new Promise((resolve, reject) => {
        if (dbInstance) return resolve(dbInstance);
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => { dbInstance = req.result; resolve(dbInstance); };
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('workspace')) {
                db.createObjectStore('workspace', { keyPath: 'id' });
            }
        };
    });
}

async function dbGetAll(store) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const s = tx.objectStore(store);
        const req = s.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function dbGet(store, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const s = tx.objectStore(store);
        const req = s.get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function dbPut(store, data) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const s = tx.objectStore(store);
        const req = s.put(data);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
    });
}

async function dbClear(store) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const s = tx.objectStore(store);
        const req = s.clear();
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
    });
}

/* ============================================================
   STATE
   ============================================================ */
const state = {
    leads: [],
    settings: { ...DEFAULT_SETTINGS },
    dailyActivity: {},
    sourceColumns: [],
    currentPage: 'overview',
    selectedLeadIds: new Set(),
    searchQuery: '',
    statusFilter: 'all',
    priorityFilter: 'all',
    websiteFilter: 'all',
    ratingFilter: 'all',
    reviewsFilter: 'all',
    sortField: 'priority-desc',
    leadDetailId: null,
    followupTab: 'overdue',
    analyticsPeriod: '30d',
    charts: {},
    importStats: null
};

/* ============================================================
   UTILITIES
   ============================================================ */
function escapeHTML(value) {
    if (value === null || value === undefined) return '';
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function escapeAttr(value) {
    if (value === null || value === undefined) return '';
    return String(value)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'");
}

function formatCurrency(amount, currency = 'INR') {
    if (currency === 'INR') {
        return '?' + Number(amount || 0).toLocaleString('en-IN');
    }
    return currency + ' ' + Number(amount || 0).toLocaleString();
}

function formatDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '—';
    const now = new Date();
    const diff = now - d;
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);
    if (minutes < 1) return 'Just now';
    if (minutes < 60) return `${minutes}m ago`;
    if (hours < 24) return `${hours}h ago`;
    if (days < 7) return `${days}d ago`;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatFullDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });
}

function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}

function todayStr() {
    return new Date().toISOString().split('T')[0];
}

function debounce(fn, delay) {
    let timer;
    return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
    };
}

/* ============================================================
   TOAST SYSTEM
   ============================================================ */
function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    const icons = {
        success: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
        error: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
        info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>'
    };
    toast.innerHTML = `${icons[type] || icons.info}<span>${escapeHTML(message)}</span>`;
    container.appendChild(toast);
    requestAnimationFrame(() => {
        requestAnimationFrame(() => toast.classList.add('show'));
    });
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }, 2800);
}

/* ============================================================
   MODAL SYSTEM
   ============================================================ */
function showModal(contentHTML) {
    const overlay = document.getElementById('modal-overlay');
    const modal = document.getElementById('modal');
    modal.innerHTML = contentHTML;
    overlay.classList.add('show');
    return new Promise((resolve) => {
        overlay._resolve = resolve;
        overlay.onclick = (e) => {
            if (e.target === overlay) { closeModal(false); }
        };
    });
}

function closeModal(value) {
    const overlay = document.getElementById('modal-overlay');
    overlay.classList.remove('show');
    if (overlay._resolve) { overlay._resolve(value); overlay._resolve = null; }
}

/* ============================================================
   DRAWER SYSTEM
   ============================================================ */
function openDrawer(title, bodyHTML) {
    document.getElementById('drawer-title').textContent = title;
    document.getElementById('drawer-body').innerHTML = bodyHTML;
    document.getElementById('drawer').classList.add('show');
    document.getElementById('drawer-overlay').classList.add('show');
    document.body.style.overflow = 'hidden';
}

/* ============================================================
   INDEXED DB PERSISTENCE
   ============================================================ */
async function saveToDB() {
    try {
        const db = await openDB();
        const tx = db.transaction('workspace', 'readwrite');
        const store = tx.objectStore('workspace');
        store.put({ id: 'leads', data: state.leads });
        store.put({ id: 'settings', data: state.settings });
        store.put({ id: 'dailyActivity', data: state.dailyActivity });
        store.put({ id: 'sourceColumns', data: state.sourceColumns });
        await new Promise((resolve, reject) => {
            tx.oncomplete = resolve;
            tx.onerror = () => reject(tx.error);
        });
    } catch (e) {
        console.error('Failed to save to IndexedDB:', e);
        try {
            localStorage.setItem('leadflow_leads', JSON.stringify(state.leads));
            localStorage.setItem('leadflow_settings', JSON.stringify(state.settings));
            localStorage.setItem('leadflow_activity', JSON.stringify(state.dailyActivity));
        } catch (e2) {
            console.error('localStorage fallback also failed:', e2);
        }
    }
}

async function loadFromDB() {
    try {
        const db = await openDB();
        const tx = db.transaction('workspace', 'readonly');
        const store = tx.objectStore('workspace');
        const getLeads = store.get('leads');
        const getSettings = store.get('settings');
        const getActivity = store.get('dailyActivity');
        const getColumns = store.get('sourceColumns');
        await new Promise((resolve, reject) => {
            tx.oncomplete = resolve;
            tx.onerror = () => reject(tx.error);
        });
        if (getLeads.result) state.leads = getLeads.result.data;
        if (getSettings.result) state.settings = { ...DEFAULT_SETTINGS, ...getSettings.result.data };
        if (getActivity.result) state.dailyActivity = getActivity.result.data || {};
        if (getColumns.result) state.sourceColumns = getColumns.result.data || [];
    } catch (e) {
        console.error('Failed to load from IndexedDB, trying localStorage:', e);
        try {
            const savedLeads = localStorage.getItem('leadflow_leads');
            const savedSettings = localStorage.getItem('leadflow_settings');
            const savedActivity = localStorage.getItem('leadflow_activity');
            if (savedLeads) state.leads = JSON.parse(savedLeads);
            if (savedSettings) state.settings = { ...DEFAULT_SETTINGS, ...JSON.parse(savedSettings) };
            if (savedActivity) state.dailyActivity = JSON.parse(savedActivity) || {};
        } catch (e2) {
            console.error('localStorage fallback also failed:', e2);
        }
    }
}

/* ============================================================
   DATA OPERATIONS
   ============================================================ */
function initLead(row, index) {
    const lead = {
        id: generateId(),
        _source: { ...row },
        crm_status: row.crm_status || 'NOT_CALLED',
        call_count: Number(row.call_count) || 0,
        last_called_at: row.last_called_at || null,
        follow_up_date: row.follow_up_date || null,
        notes: row.notes || '',
        deal_value: row.deal_value ? Number(row.deal_value) : null,
        deal_closed_at: row.deal_closed_at || null,
        assigned_to: row.assigned_to || '',
        priority: row.priority || calculatePriority(row),
        custom_tags: row.custom_tags || '',
        _activity: row._activity ? JSON.parse(row._activity) : [],
        _index: index
    };
    if (lead.crm_status === 'CLOSED_DEAL' && !lead.deal_value) {
        lead.deal_value = state.settings.defaultDealValue;
    }
    return lead;
}

function calculatePriority(row) {
    let score = 0;
    const rating = parseFloat(row.rating);
    const reviews = parseInt(row.reviews) || 0;
    const hasWebsite = !!(row.website && String(row.website).trim());
    const hasPhone = !!(row.phone && String(row.phone).trim());
    if (!isNaN(rating)) {
        if (rating >= 4.5) score += 40;
        else if (rating >= 4.0) score += 30;
        else if (rating >= 3.5) score += 20;
        else if (rating >= 3.0) score += 10;
    }
    if (reviews >= 1000) score += 30;
    else if (reviews >= 500) score += 25;
    else if (reviews >= 100) score += 15;
    else if (reviews >= 10) score += 10;
    else if (reviews > 0) score += 5;
    if (hasWebsite) score += 15;
    if (hasPhone) score += 10;
    if (row.is_spending_on_ads) score += 5;
    if (score >= 80) return 'HOT';
    if (score >= 60) return 'HIGH';
    if (score >= 35) return 'MEDIUM';
    return 'LOW';
}

function calculateLeadScore(row) {
    let score = 0;
    const rating = parseFloat(row.rating);
    const reviews = parseInt(row.reviews) || 0;
    const hasWebsite = !!(row.website && String(row.website).trim());
    const hasPhone = !!(row.phone && String(row.phone).trim());
    const hasDescription = !!(row.description && String(row.description).trim());
    const hasAddress = !!(row.address && String(row.address).trim());
    const hasOwner = !!(row.owner_name && String(row.owner_name).trim());
    if (!isNaN(rating)) score += Math.min(25, rating * 5);
    if (reviews >= 1000) score += 25;
    else if (reviews >= 500) score += 20;
    else if (reviews >= 100) score += 15;
    else if (reviews >= 10) score += 10;
    else if (reviews > 0) score += 5;
    if (hasWebsite) score += 15;
    if (hasPhone) score += 15;
    if (hasDescription) score += 5;
    if (hasAddress) score += 5;
    if (hasOwner) score += 5;
    score = Math.max(0, Math.min(100, score));
    return Math.round(score);
}

function addActivity(leadId, text) {
    const lead = state.leads.find(l => l.id === leadId);
    if (!lead) return;
    if (!lead._activity) lead._activity = [];
    lead._activity.unshift({
        text,
        timestamp: new Date().toISOString()
    });
    if (lead._activity.length > 50) lead._activity = lead._activity.slice(0, 50);
}

function getLeadDisplayName(lead) {
    return lead._source?.name || lead.name || 'Unnamed Lead';
}
function getLeadCategory(lead) {
    return lead._source?.main_category || lead._source?.categories?.split(',')[0]?.trim() || '';
}
function getLeadAddress(lead) {
    return lead._source?.address || '';
}
function getLeadRating(lead) {
    return lead._source?.rating;
}
function getLeadReviews(lead) {
    return lead._source?.reviews;
}
function getLeadPhone(lead) {
    return lead._source?.phone || '';
}
function getLeadWebsite(lead) {
    return lead._source?.website || '';
}
function getLeadImage(lead) {
    return lead._source?.featured_image || '';
}
function getLeadMapsLink(lead) {
    return lead._source?.link || '';
}
function getLeadDescription(lead) {
    return lead._source?.description || '';
}
function getSourceColumnNames() {
    if (state.sourceColumns.length > 0) return state.sourceColumns;
    if (state.leads.length > 0) {
        const sourceKeys = Object.keys(state.leads[0]._source || {});
        if (sourceKeys.length > 0) {
            state.sourceColumns = sourceKeys;
            return sourceKeys;
        }
    }
    return [
        'place_id','name','description','is_spending_on_ads','reviews','rating',
        'competitors','website','phone','can_claim','owner_name','owner_profile_link',
        'featured_image','main_category','categories','workday_timing','is_temporarily_closed',
        'closed_on','address','review_keywords','link','query'
    ];
}

/* ============================================================
   FILTERING & SORTING
   ============================================================ */
function getFilteredLeads() {
    let filtered = [...state.leads];
    const q = state.searchQuery.toLowerCase().trim();
    if (q) {
        filtered = filtered.filter(lead => {
            const searchable = [
                getLeadDisplayName(lead),
                getLeadPhone(lead),
                getLeadAddress(lead),
                getLeadCategory(lead)
            ].join(' ').toLowerCase();
            return searchable.includes(q);
        });
    }
    if (state.statusFilter !== 'all') {
        filtered = filtered.filter(l => l.crm_status === state.statusFilter);
    }
    if (state.priorityFilter !== 'all') {
        filtered = filtered.filter(l => l.priority === state.priorityFilter);
    }
    if (state.websiteFilter === 'has') {
        filtered = filtered.filter(l => getLeadWebsite(l));
    } else if (state.websiteFilter === 'none') {
        filtered = filtered.filter(l => !getLeadWebsite(l));
    }
    if (state.ratingFilter !== 'all') {
        const minRating = parseFloat(state.ratingFilter);
        filtered = filtered.filter(l => {
            const r = getLeadRating(l);
            return !isNaN(r) && r >= minRating;
        });
    }
    if (state.reviewsFilter !== 'all') {
        const minReviews = parseInt(state.reviewsFilter);
        filtered = filtered.filter(l => {
            const r = getLeadReviews(l);
            return !isNaN(r) && r >= minReviews;
        });
    }
    const [sortField, sortDir] = state.sortField.split('-');
    filtered.sort((a, b) => {
        let valA, valB;
        switch (sortField) {
            case 'name': valA = getLeadDisplayName(a).toLowerCase(); valB = getLeadDisplayName(b).toLowerCase(); break;
            case 'rating': valA = getLeadRating(a) || 0; valB = getLeadRating(b) || 0; break;
            case 'reviews': valA = getLeadReviews(a) || 0; valB = getLeadReviews(b) || 0; break;
            case 'priority': valA = PRIORITIES.indexOf(a.priority); valB = PRIORITIES.indexOf(b.priority); break;
            case 'status': valA = STATUSES.indexOf(a.crm_status); valB = STATUSES.indexOf(b.crm_status); break;
            case 'lastCalled': valA = a.last_called_at ? new Date(a.last_called_at).getTime() : 0; valB = b.last_called_at ? new Date(b.last_called_at).getTime() : 0; break;
            case 'callCount': valA = a.call_count; valB = b.call_count; break;
            case 'dealValue': valA = a.deal_value || 0; valB = b.deal_value || 0; break;
            default: valA = 0; valB = 0;
        }
        if (typeof valA === 'string') {
            return sortDir === 'desc' ? valB.localeCompare(valA) : valA.localeCompare(valB);
        }
        return sortDir === 'desc' ? valB - valA : valA - valB;
    });
    return filtered;
}

/* ============================================================
   ANALYTICS HELPERS
   ============================================================ */
function getAnalytics() {
    const leads = state.leads;
    const total = leads.length;
    const called = leads.filter(l => ['CALLED','INTERESTED','NOT_INTERESTED','FOLLOW_UP','CLOSED_DEAL'].includes(l.crm_status)).length;
    const interested = leads.filter(l => l.crm_status === 'INTERESTED').length;
    const notInterested = leads.filter(l => l.crm_status === 'NOT_INTERESTED').length;
    const followUps = leads.filter(l => l.crm_status === 'FOLLOW_UP').length;
    const closedDeals = leads.filter(l => l.crm_status === 'CLOSED_DEAL').length;
    const totalRevenue = leads.filter(l => l.crm_status === 'CLOSED_DEAL').reduce((sum, l) => sum + (l.deal_value || state.settings.defaultDealValue), 0);
    const avgDealValue = closedDeals > 0 ? totalRevenue / closedDeals : 0;
    const callRate = total > 0 ? (called / total * 100) : 0;
    const interestRate = called > 0 ? (interested / called * 100) : 0;
    const followUpRate = called > 0 ? (followUps / called * 100) : 0;
    const closeRate = called > 0 ? (closedDeals / called * 100) : 0;
    const leadToDealRate = total > 0 ? (closedDeals / total * 100) : 0;
    const revenuePerCall = called > 0 ? totalRevenue / called : 0;
    const totalCalls = leads.reduce((sum, l) => sum + (l.call_count || 0), 0);
    return {
        total, called, interested, notInterested, followUps, closedDeals,
        totalRevenue, avgDealValue, callRate, interestRate, followUpRate, closeRate,
        leadToDealRate, revenuePerCall, totalCalls
    };
}

function getDailyAnalytics() {
    const activity = state.dailyActivity || {};
    const days = Object.keys(activity).sort().reverse();
    const period = state.analyticsPeriod;
    let filteredDays = days;
    if (period === '7d') filteredDays = days.slice(0, 7);
    else if (period === '30d') filteredDays = days.slice(0, 30);
    else if (period === '90d') filteredDays = days.slice(0, 90);
    return filteredDays.map(day => ({
        date: day,
        ...activity[day]
    }));
}

function getTodayStats() {
    const today = todayStr();
    const activity = state.dailyActivity[today] || { calls: 0, interested: 0, notInterested: 0, followUps: 0, closedDeals: 0, revenue: 0 };
    return activity;
}

function recordDailyActivity(status, dealValue = 0) {
    const today = todayStr();
    if (!state.dailyActivity[today]) {
        state.dailyActivity[today] = { calls: 0, interested: 0, notInterested: 0, followUps: 0, closedDeals: 0, revenue: 0 };
    }
    const day = state.dailyActivity[today];
    switch (status) {
        case 'CALLED': day.calls++; break;
        case 'INTERESTED': day.interested++; break;
        case 'NOT_INTERESTED': day.notInterested++; break;
        case 'FOLLOW_UP': day.followUps++; break;
        case 'CLOSED_DEAL':
            day.closedDeals++;
            day.revenue += Number(dealValue) || 0;
            break;
    }
}

/* ============================================================
   IMPORT / EXPORT
   ============================================================ */
function getExportData() {
    const sourceCols = getSourceColumnNames();
    return state.leads.map(lead => {
        const row = {};
        for (const col of sourceCols) {
            row[col] = lead._source?.[col] ?? '';
        }
        for (const col of CRM_COLUMNS) {
            let val = lead[col];
            if (col === '_activity' || col === '_index' || col === '_source') continue;
            if (col === 'deal_value' && val) val = Number(val);
            if (col === 'call_count') val = Number(val) || 0;
            row[col] = val ?? '';
        }
        return row;
    });
}

function exportCSV() {
    if (!state.leads.length) {
        showToast('No leads to export', 'error');
        return;
    }
    const data = getExportData();
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Leads');
    const date = new Date().toISOString().split('T')[0];
    XLSX.writeFile(wb, `leadflow_export_${date}.xlsx`);
    showToast('CSV exported successfully', 'success');
}

function parseFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const workbook = XLSX.read(e.target.result, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                resolve(rows);
            } catch (error) {
                reject(error);
            }
        };
        reader.onerror = () => reject(new Error('Failed to read file'));
        reader.readAsArrayBuffer(file);
    });
}

function processImportRows(rows, merge = false) {
    const stats = { total: rows.length, valid: 0, missingPhone: 0, missingName: 0, duplicates: 0 };
    const newLeads = [];
    const existingPlaceIds = new Set(state.leads.map(l => l._source?.place_id).filter(Boolean));
    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const placeId = String(row.place_id || '').trim();
        const name = String(row.name || '').trim();
        const phone = String(row.phone || '').trim();
        if (!placeId && !name) { stats.missingName++; continue; }
        if (!phone) stats.missingPhone++;
        if (placeId && existingPlaceIds.has(placeId)) {
            stats.duplicates++;
            if (!merge) continue;
        }
        const lead = initLead(row, i);
        newLeads.push(lead);
        if (placeId) existingPlaceIds.add(placeId);
        stats.valid++;
    }
    return { newLeads, stats };
}

async function handleFileImport(file, merge = false) {
    try {
        showToast('Importing file...', 'info');
        const rows = await parseFile(file);
        if (!rows.length) {
            showToast('No data found in file', 'error');
            return;
        }
        if (rows.length > 0) {
            state.sourceColumns = Object.keys(rows[0]);
        }
        const { newLeads, stats } = processImportRows(rows, merge);
        if (newLeads.length === 0 && !merge) {
            showToast('No new leads to import (all duplicates)', 'error');
            return;
        }
        state.leads = merge ? [...state.leads, ...newLeads] : newLeads;
        state.importStats = stats;
        await saveToDB();
        App.render();
        showToast(`${stats.valid} leads imported successfully`, 'success');
    } catch (error) {
        console.error('Import error:', error);
        showToast('Failed to import file: ' + error.message, 'error');
    }
}

/* ============================================================
   CALL TRACKING
   ============================================================ */
function logCall(leadId) {
    const lead = state.leads.find(l => l.id === leadId);
    if (!lead) return;
    const prevStatus = lead.crm_status;
    if (prevStatus === 'NOT_CALLED') {
        lead.crm_status = 'CALLED';
    }
    lead.call_count = (lead.call_count || 0) + 1;
    lead.last_called_at = new Date().toISOString();
    recordDailyActivity('CALLED');
    addActivity(leadId, 'Called lead');
    saveToDB().then(() => App.render());
    showToast('Call logged', 'success');
}

/* ============================================================
   STATUS MANAGEMENT
   ============================================================ */
function changeLeadStatus(leadId, newStatus) {
    const lead = state.leads.find(l => l.id === leadId);
    if (!lead || lead.crm_status === newStatus) return;
    const oldStatus = lead.crm_status;
    lead.crm_status = newStatus;
    if (newStatus === 'CLOSED_DEAL') {
        if (!lead.deal_value) {
            lead.deal_value = state.settings.defaultDealValue;
        }
        lead.deal_closed_at = new Date().toISOString();
        recordDailyActivity('CLOSED_DEAL', lead.deal_value);
        addActivity(leadId, `Deal closed — ${formatCurrency(lead.deal_value)}`);
    } else if (newStatus === 'INTERESTED') {
        recordDailyActivity('INTERESTED');
        addActivity(leadId, 'Marked as interested');
    } else if (newStatus === 'NOT_INTERESTED') {
        recordDailyActivity('NOT_INTERESTED');
        addActivity(leadId, 'Marked as not interested');
    } else if (newStatus === 'FOLLOW_UP') {
        recordDailyActivity('FOLLOW_UP');
        addActivity(leadId, 'Follow-up scheduled');
    } else if (newStatus === 'CALLED') {
        recordDailyActivity('CALLED');
        addActivity(leadId, 'Status changed to Called');
    }
    saveToDB().then(() => {
        App.render();
        if (newStatus === 'CLOSED_DEAL') {
            showToast(`Deal closed — ${formatCurrency(lead.deal_value)}`, 'success');
        } else if (newStatus === 'INTERESTED') {
            showToast('Lead marked as interested', 'success');
        } else if (newStatus === 'NOT_INTERESTED') {
            showToast('Lead marked as not interested', 'info');
        } else if (newStatus === 'FOLLOW_UP') {
            showToast('Follow-up scheduled', 'success');
        }
    });
}

async function closeDeal(leadId, dealValue) {
    const lead = state.leads.find(l => l.id === leadId);
    if (!lead) return;
    lead.crm_status = 'CLOSED_DEAL';
    lead.deal_value = dealValue;
    lead.deal_closed_at = new Date().toISOString();
    recordDailyActivity('CLOSED_DEAL', dealValue);
    addActivity(leadId, `Deal closed — ${formatCurrency(dealValue)}`);
    await saveToDB();
    App.render();
    showToast(`Deal closed — ${formatCurrency(dealValue)}`, 'success');
}

function updateLeadField(leadId, field, value) {

    if (!lead) return;
    lead[field] = value;
    saveToDB().then(() => App.render());
}

function updateLeadFields(leadId, updates) {
    const lead = state.leads.find(l => l.id === leadId);
    if (!lead) return;
    Object.assign(lead, updates);
    saveToDB().then(() => App.render());

/* ============================================================
   FOLLOW UPS
   ============================================================ */
function getFollowups() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const followUps = state.leads.filter(l => l.crm_status === 'FOLLOW_UP' && l.follow_up_date);
    return {
        overdue: followUps.filter(l => new Date(l.follow_up_date) < today).sort((a, b) => new Date(a.follow_up_date) - new Date(b.follow_up_date)),
        today: followUps.filter(l => {
            const d = new Date(l.follow_up_date);
            return d >= today && d < tomorrow;
        }).sort((a, b) => new Date(a.follow_up_date) - new Date(b.follow_up_date)),
        upcoming: followUps.filter(l => new Date(l.follow_up_date) >= tomorrow).sort((a, b) => new Date(a.follow_up_date) - new Date(b.follow_up_date))
    };
}

function scheduleFollowup(leadId, dateStr) {
    updateLeadField(leadId, 'follow_up_date', dateStr);
    addActivity(leadId, `Follow-up scheduled for ${new Date(dateStr).toLocaleDateString()}`);
    showToast('Follow-up scheduled', 'success');
}

/* ============================================================
   BULK ACTIONS
   ============================================================ */
function bulkUpdateStatus(status) {
    let count = 0;
    for (const id of state.selectedLeadIds) {
        const lead = state.leads.find(l => l.id === id);
        if (lead && lead.crm_status !== status) {
            lead.crm_status = status;
            if (status === 'CLOSED_DEAL') {
                if (!lead.deal_value) lead.deal_value = state.settings.defaultDealValue;
                lead.deal_closed_at = new Date().toISOString();
                recordDailyActivity('CLOSED_DEAL', lead.deal_value);
            }
            count++;
        }
    }
    state.selectedLeadIds.clear();
    saveToDB().then(() => App.render());
    showToast(`${count} leads updated`, 'success');
}

function bulkSetPriority(priority) {
    let count = 0;
    for (const id of state.selectedLeadIds) {
        const lead = state.leads.find(l => l.id === id);
        if (lead) { lead.priority = priority; count++; }
    }
    state.selectedLeadIds.clear();
    saveToDB().then(() => App.render());
    showToast(`${count} leads set to ${priority}`, 'success');
}

function bulkClearCRM() {
    let count = 0;
    for (const id of state.selectedLeadIds) {
        const lead = state.leads.find(l => l.id === id);
        if (lead) {
            lead.crm_status = 'NOT_CALLED';
            lead.call_count = 0;
            lead.last_called_at = null;
            lead.follow_up_date = null;
            lead.notes = '';
            lead.deal_value = null;
            lead.deal_closed_at = null;
            lead.priority = calculatePriority(lead._source || {});
            lead.custom_tags = '';
            lead._activity = [];
            count++;
        }
    }
    state.selectedLeadIds.clear();
    saveToDB().then(() => App.render());
    showToast(`CRM data cleared for ${count} leads`, 'success');
}

function bulkDeleteSelected() {
    const count = state.selectedLeadIds.size;
    if (!count) return;
    state.leads = state.leads.filter(l => !state.selectedLeadIds.has(l.id));
    state.selectedLeadIds.clear();
    saveToDB().then(() => App.render());
    showToast(`${count} leads deleted`, 'success');
}

function exportSelectedLeads() {
    if (!state.selectedLeadIds.size) {
        showToast('No leads selected', 'error');
        return;
    }
    const selected = state.leads.filter(l => state.selectedLeadIds.has(l.id));
    const sourceCols = getSourceColumnNames();
    const data = selected.map(lead => {
        const row = {};
        for (const col of sourceCols) row[col] = lead._source?.[col] ?? '';
        for (const col of CRM_COLUMNS) {
            if (col === '_activity' || col === '_index' || col === '_source') continue;
            row[col] = lead[col] ?? '';
        }
        return row;
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Selected');
    const date = new Date().toISOString().split('T')[0];
    XLSX.writeFile(wb, `leadflow_selected_${date}.xlsx`);
    showToast('Selected leads exported', 'success');
}

/* ============================================================

   ============================================================ */
function statusLabel(status) {
    return status.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function statusClass(status) {
    return status.toLowerCase().replace(/_/g, '-');
}

function priorityClass(priority) {
    return priority ? priority.toLowerCase() : 'medium';
}

function renderKPI(label, value, accent, icon, meta = '') {
    return `
        <div class="kpi-card accent-${accent}">
            <div class="kpi-header">
                <div class="kpi-icon">${icon}</div>
            </div>
            <div class="kpi-value">${value}</div>
            <div class="kpi-label">${label}</div>
            ${meta ? `<div class="kpi-meta">${meta}</div>` : ''}
        </div>
    `;
}

function renderEmptyState(icon, title, message, action = null) {
    return `
        <div class="empty-state">
            ${icon}
            <h3>${title}</h3>
            <p>${message}</p>
            ${action ? `<button class="btn btn-primary mt-4" onclick="${action}">Get Started</button>` : ''}
        </div>
    `;
}

        return tb - ta;

                ${renderKPI('Closed Deals', analytics.closedDeals.toLocaleString(), 'green', svgIcon('check', 20), `${analytics.closeRate.toFixed(1)}% close rate`)}

                        ['name-desc','Name (Z-A)'],
                        ['rating-desc','Rating (High to Low)'],

            </div>

            <!-- Bulk Bar -->
            ${state.selectedLeadIds.size > 0 ? `
            <div class="bulk-bar show">
                <span>${state.selectedLeadIds.size} selected</span>

                <button class="btn btn-xs" onclick="bulkUpdateStatus('INTERESTED')">Mark Interested</button>
                <button class="btn btn-xs" onclick="bulkUpdateStatus('FOLLOW_UP')">Follow Up</button>
                <button class="btn btn-xs" onclick="bulkUpdateStatus('NOT_INTERESTED')">Not Interested</button>
                <button class="btn btn-xs" onclick="bulkSetPriority('HOT')">HOT</button>
                <button class="btn btn-xs" onclick="bulkSetPriority('HIGH')">HIGH</button>

            <!-- Table -->
            <div class="table-wrap">
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th style="width:40px"><input type="checkbox" onchange="App.toggleSelectAll(this.checked)" /></th>
                                <th>Lead</th>
                                <th>Category</th>
                                <th>Rating</th>
                                <th>Reviews</th>
                                <th>Phone</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Last Called</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="leadTable">
                            ${pageLeads.length === 0 ? `
                                <tr><td colspan="10">
                                    ${state.leads.length === 0 ? renderEmptyState(svgIcon('inbox', 48), 'No leads imported', 'Import a CSV file to get started', "App.navigate('overview')") : renderEmptyState(svgIcon('search', 48), 'No results', 'Try adjusting your filters')}
                                </td></tr>
                            ` : pageLeads.map((lead, idx) => {
                                const name = getLeadDisplayName(lead);
                                const category = getLeadCategory(lead);
                                const rating = getLeadRating(lead);
                                const reviews = getLeadReviews(lead);
                                const phone = getLeadPhone(lead);
                                const image = getLeadImage(lead);
                                const mapsLink = getLeadMapsLink(lead);
                                const website = getLeadWebsite(lead);
                                const score = calculateLeadScore(lead._source || {});
                                return `
                                <tr class="${state.selectedLeadIds.has(lead.id) ? 'selected' : ''}" onclick="if(!event.target.closest('button')&&!event.target.closest('select')&&!event.target.closest('a'))App.openLead('${lead.id}')">
                                    <td onclick="event.stopPropagation()"><input type="checkbox" ${state.selectedLeadIds.has(lead.id) ? 'checked' : ''} onchange="App.toggleSelect('${lead.id}', this.checked)" /></td>
                                    <td>
                                        <div class="lead-cell">
                                            ${image ? `<img class="lead-avatar" src="${escapeHTML(image)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" />` : ''}
                                            <div class="lead-avatar-fallback" style="${image ? 'display:none' : ''}">${name.charAt(0).toUpperCase()}</div>
                                            <div>
                                                <div class="lead-name">${escapeHTML(name)}</div>
                                                <div class="lead-score">
                                                    <span class="lead-score-ring" style="background:${score >= 70 ? 'rgba(52,211,153,0.15)' : score >= 40 ? 'rgba(91,124,255,0.15)' : 'rgba(255,255,255,0.05)'};color:${score >= 70 ? 'var(--green)' : score >= 40 ? 'var(--blue)' : 'var(--text-secondary)'}">${score}</span>
                                                    <span class="text-muted text-xs">score</span>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                    <td><div class="truncate" style="max-width:140px" title="${escapeHTML(category)}">${escapeHTML(category) || '<span class="text-muted">—</span>'}</div></td>
                                    <td>${rating ? `<span class="rating-badge">${svgIcon('star', 14)} ${rating}</span>` : '<span class="text-muted">—</span>'}</td>
                                    <td>${reviews ? reviews.toLocaleString() : '<span class="text-muted">—</span>'}</td>
                                    <td><span class="phone-text">${escapeHTML(phone) || '<span class="text-muted">—</span>'}</span></td>
                                    <td onclick="event.stopPropagation()">
                                        <select class="status-select" style="background:var(--panel);border:1px solid var(--border);padding:5px 24px 5px 8px;font-size:10px" onchange="setPriority('${lead.id}', this.value)">
                                            ${PRIORITIES.map(p => `<option value="${p}" ${lead.priority === p ? 'selected' : ''}>${p}</option>`).join('')}
                                        </select>
                                    </td>
                                    <td onclick="event.stopPropagation()">
                                        <span class="status-pill status-${statusClass(lead.crm_status)}">${statusLabel(lead.crm_status)}</span>
                                    </td>
                                    <td><span class="text-xs text-muted">${formatDate(lead.last_called_at)}</span></td>
                                    <td onclick="event.stopPropagation()">
                                        <div style="display:flex;gap:6px;flex-wrap:wrap">
                                            ${phone ? `<button class="btn btn-success btn-xs" onclick="event.stopPropagation();logCall('${lead.id}')" title="Log Call">${svgIcon('phone', 14)}</button>` : ''}
                                            ${mapsLink ? `<a href="${escapeHTML(mapsLink)}" target="_blank" rel="noopener" class="btn btn-xs" title="Open in Google Maps" onclick="event.stopPropagation()">${svgIcon('map', 14)}</a>` : ''}
                                            ${website ? `<a href="${escapeHTML(website)}" target="_blank" rel="noopener" class="btn btn-xs" title="Visit Website" onclick="event.stopPropagation()">${svgIcon('globe', 14)}</a>` : ''}
                                            <button class="btn btn-xs" onclick="event.stopPropagation();App.openLead('${lead.id}')" title="View Details">${svgIcon('external', 14)}</button>
                                        </div>
                                    </td>
                                </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
                <div class="table-footer">
                    <div>${filtered.length} leads • Page ${page} of ${totalPages}</div>
                    <div class="pagination">
                        <button class="page-btn" onclick="App.goToPage(${page - 1})" ${page <= 1 ? 'disabled' : ''}>‹</button>
                        ${Array.from({length: Math.min(5, totalPages)}, (_, i) => {
                            let p = page - 2 + i;
                            if (p < 1) p = 1;
                            if (p > totalPages) p = totalPages;
                            return `<button class="page-btn ${p === page ? 'active' : ''}" onclick="App.goToPage(${p})">${p}</button>`;
                        }).join('')}
                        <button class="page-btn" onclick="App.goToPage(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>›</button>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function renderLeadDetail(lead) {
    const name = getLeadDisplayName(lead);
    const category = getLeadCategory(lead);
    const rating = getLeadRating(lead);
    const reviews = getLeadReviews(lead);
    const phone = getLeadPhone(lead);
    const website = getLeadWebsite(lead);
    const image = getLeadImage(lead);
    const mapsLink = getLeadMapsLink(lead);
    const description = getLeadDescription(lead);
    const address = getLeadAddress(lead);
    const score = calculateLeadScore(lead._source || {});
    const activities = lead._activity || [];
    return `
        <div>
            <!-- Image -->
            ${image ? `<img class="lead-detail-image" src="${escapeHTML(image)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" />` : ''}

                ${phone ? `<button class="btn btn-success" onclick="logCall('${lead.id}');App.renderDrawer()">${svgIcon('phone', 16)} Call Lead</button>` : ''}
                ${mapsLink ? `<a href="${escapeHTML(mapsLink)}" target="_blank" rel="noopener" class="btn">${svgIcon('map', 16)} Open in Google Maps</a>` : ''}
                ${website ? `<a href="${escapeHTML(website)}" target="_blank" rel="noopener" class="btn">${svgIcon('globe', 16)} Visit Website</a>` : `<span class="btn" style="opacity:0.5;cursor:default">${svgIcon('globe', 16)} No Website</span>`}
            </div>

            <!-- Info Grid -->
            <div class="grid-2" style="margin-bottom:16px">
                <div>
                    <div style="font-size:20px;font-weight:800;margin-bottom:4px">${escapeHTML(name)}</div>
                    ${category ? `<div style="color:var(--text-secondary);font-size:13px;margin-bottom:8px">${escapeHTML(category)}</div>` : ''}
                    ${rating ? `<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><span class="rating-badge">${svgIcon('star', 16)} ${rating}</span>${reviews ? `<span style="color:var(--text-secondary);font-size:12px">${reviews.toLocaleString()} reviews</span>` : ''}</div>` : ''}

                <div style="text-align:right">
                    <div class="lead-score" style="font-size:13px;padding:6px 12px">
                        <span class="lead-score-ring" style="width:28px;height:28px;font-size:11px;background:${score >= 70 ? 'rgba(52,211,153,0.15)' : score >= 40 ? 'rgba(91,124,255,0.15)' : 'rgba(255,255,255,0.05)'};color:${score >= 70 ? 'var(--green)' : score >= 40 ? 'var(--blue)' : 'var(--text-secondary)'}">${score}</span>
                        Lead Score
                    </div>
                </div>
            </div>

            <!-- CRM Fields -->

                <div class="card-title">CRM Details</div>
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select class="form-select" onchange="changeLeadStatus('${lead.id}', this.value);App.renderDrawer()">
                            ${STATUSES.map(s => `<option value="${s}" ${lead.crm_status === s ? 'selected' : ''}>${statusLabel(s)}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Priority</label>
                        <select class="form-select" onchange="setPriority('${lead.id}', this.value);App.renderDrawer()">
                            ${PRIORITIES.map(p => `<option value="${p}" ${lead.priority === p ? 'selected' : ''}>${p}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Call Count</label>
                        <div style="font-size:20px;font-weight:800;color:var(--blue)">${lead.call_count || 0}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Last Called</label>
                        <div style="font-size:13px;color:var(--text-secondary)">${formatFullDate(lead.last_called_at)}</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Follow-up Date</label>

                    </div>
                    <div class="form-group">
                        <label class="form-label">Deal Value</label>
                        <input type="number" class="form-input" value="${lead.deal_value || ''}" placeholder="?0" onchange="updateLeadField('${lead.id}', 'deal_value', this.value ? Number(this.value) : null)" />
                    </div>
                    ${lead.deal_closed_at ? `<div class="form-group"><label class="form-label">Deal Closed At</label><div style="font-size:13px;color:var(--text-secondary)">${formatFullDate(lead.deal_closed_at)}</div></div>` : ''}
                </div>
            </div>

            <!-- Notes -->
            <div class="card" style="margin-bottom:16px">

                <textarea class="form-textarea" placeholder="Add notes about this lead..." onchange="updateLeadField('${lead.id}', 'notes', this.value)">${escapeHTML(lead.notes || '')}</textarea>

                            <div class="timeline-text">${escapeHTML(act.text)}</div>
