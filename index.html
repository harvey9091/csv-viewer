<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LeadFlow — Lead Manager</title>

<!-- XLSX support -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root {
    --bg: #070a12;
    --panel: rgba(15, 20, 34, .82);
    --panel-2: rgba(20, 27, 45, .9);
    --border: rgba(255,255,255,.08);
    --border-hover: rgba(255,255,255,.16);
    --text: #f4f7ff;
    --muted: #8791aa;
    --blue: #5b7cff;
    --blue-2: #3155e7;
    --cyan: #55d6d2;
    --green: #42d392;
    --red: #ff5f6d;
    --yellow: #f6c85f;
    --shadow: 0 24px 80px rgba(0,0,0,.38);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 15% 0%, rgba(49,85,231,.18), transparent 30%),
        radial-gradient(circle at 90% 10%, rgba(85,214,210,.10), transparent 28%),
        var(--bg);
}

/* ---------- APP ---------- */

.app {
    max-width: 1500px;
    margin: auto;
    padding: 28px;
}

/* ---------- HEADER ---------- */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: 19px;
    color: white;
    background:
        linear-gradient(135deg, var(--blue), var(--cyan));
    box-shadow:
        0 10px 30px rgba(49,85,231,.35);
}

.brand h1 {
    margin: 0;
    font-size: 21px;
    letter-spacing: -.5px;
}

.brand p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 12px;
}

.header-actions {
    display: flex;
    gap: 10px;
}

/* ---------- BUTTONS ---------- */

button {
    font: inherit;
    cursor: pointer;
}

.btn {
    border: 1px solid var(--border);
    background: rgba(255,255,255,.045);
    color: var(--text);
    padding: 11px 16px;
    border-radius: 11px;
    transition: .18s ease;
}

.btn:hover {
    background: rgba(255,255,255,.08);
    border-color: var(--border-hover);
    transform: translateY(-1px);
}

.btn-primary {
    border: 0;
    background: linear-gradient(135deg, var(--blue-2), var(--blue));
    box-shadow: 0 10px 25px rgba(49,85,231,.25);
}

.btn-primary:hover {
    filter: brightness(1.1);
}

/* ---------- DROPZONE ---------- */

.dropzone {
    position: relative;
    border: 1px dashed rgba(91,124,255,.45);
    background:
        linear-gradient(
            135deg,
            rgba(49,85,231,.08),
            rgba(85,214,210,.035)
        );
    border-radius: 18px;
    padding: 27px;
    text-align: center;
    transition: .2s;
    margin-bottom: 22px;
}

.dropzone.dragover {
    border-color: var(--cyan);
    background: rgba(85,214,210,.08);
    transform: scale(1.005);
}

.drop-icon {
    width: 45px;
    height: 45px;
    margin: 0 auto 12px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    background: rgba(91,124,255,.12);
    color: var(--blue);
    font-size: 20px;
}

.dropzone h2 {
    margin: 0;
    font-size: 16px;
}

.dropzone p {
    margin: 7px 0 15px;
    color: var(--muted);
    font-size: 13px;
}

.file-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: white;
    color: #0a0e18;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
}

#fileInput {
    display: none;
}

/* ---------- STATS ---------- */

.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    padding: 18px;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 15px;
    box-shadow: var(--shadow);
}

.stat-label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
}

.stat-value {
    margin-top: 7px;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -.7px;
}

.stat.blue .stat-value {
    color: var(--blue);
}

.stat.green .stat-value {
    color: var(--green);
}

.stat.red .stat-value {
    color: var(--red);
}

.stat.yellow .stat-value {
    color: var(--yellow);
}

/* ---------- TOOLBAR ---------- */

.toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 13px;
}

.search {
    position: relative;
    flex: 1;
}

.search span {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
}

.search input {
    width: 100%;
    padding: 13px 15px 13px 40px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    outline: none;
    border-radius: 12px;
}

.search input:focus {
    border-color: rgba(91,124,255,.6);
    box-shadow: 0 0 0 3px rgba(91,124,255,.08);
}

.filters {
    display: flex;
    gap: 7px;
}

.filter {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 12px;
}

.filter.active {
    color: white;
    border-color: rgba(91,124,255,.45);
    background: rgba(91,124,255,.13);
}

/* ---------- TABLE ---------- */

.table-wrap {
    border: 1px solid var(--border);
    border-radius: 17px;
    overflow: hidden;
    background: rgba(10,14,24,.76);
    box-shadow: var(--shadow);
}

.table-scroll {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
}

thead {
    background: rgba(255,255,255,.025);
}

th {
    text-align: left;
    padding: 13px 17px;
    color: #737e98;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .09em;
    font-weight: 700;
    border-bottom: 1px solid var(--border);
}

td {
    padding: 14px 17px;
    border-bottom: 1px solid rgba(255,255,255,.045);
    font-size: 13px;
}

tbody tr {
    transition: .15s ease;
}

tbody tr:hover {
    background: rgba(255,255,255,.025);
}

tbody tr:last-child td {
    border-bottom: 0;
}

/* ---------- LEAD ---------- */

.lead-name {
    font-weight: 750;
    color: white;
    font-size: 14px;
}

.lead-meta {
    color: var(--muted);
    font-size: 11px;
    margin-top: 3px;
}

.phone {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #cbd4ec;
    font-size: 12px;
}

.call-btn {
    border: 0;
    border-radius: 9px;
    padding: 8px 11px;
    background: rgba(66,211,146,.10);
    color: var(--green);
    font-size: 12px;
    font-weight: 700;
}

.call-btn:hover {
    background: rgba(66,211,146,.18);
}

/* ---------- STATUS ---------- */

.status-select {
    appearance: none;
    border: 1px solid var(--border);
    color: white;
    background: #111827;
    border-radius: 9px;
    padding: 8px 28px 8px 10px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}

.status-select.not-called {
    color: #a9b3ca;
}

.status-select.called {
    color: var(--blue);
    border-color: rgba(91,124,255,.25);
}

.status-select.interested {
    color: var(--green);
    border-color: rgba(66,211,146,.25);
}

.status-select.not-interested {
    color: var(--red);
    border-color: rgba(255,95,109,.25);
}

/* ---------- EMPTY ---------- */

.empty {
    padding: 70px 20px;
    text-align: center;
    color: var(--muted);
}

.empty-icon {
    font-size: 30px;
    margin-bottom: 10px;
}

/* ---------- PAGINATION ---------- */

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 16px;
    color: var(--muted);
    font-size: 11px;
}

.pagination {
    display: flex;
    gap: 6px;
}

.page-btn {
    width: 31px;
    height: 31px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.035);
    color: var(--muted);
}

.page-btn.active {
    background: var(--blue-2);
    color: white;
    border-color: transparent;
}

/* ---------- TOAST ---------- */

.toast {
    position: fixed;
    bottom: 25px;
    right: 25px;
    padding: 13px 17px;
    border-radius: 12px;
    background: #111827;
    border: 1px solid var(--border);
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
    color: white;
    font-size: 13px;
    transform: translateY(100px);
    opacity: 0;
    pointer-events: none;
    transition: .25s ease;
    z-index: 50;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}

/* ---------- RESPONSIVE ---------- */

@media(max-width: 950px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .toolbar {
        flex-direction: column;
        align-items: stretch;
    }

    .filters {
        overflow-x: auto;
    }
}

@media(max-width: 600px) {
    .app {
        padding: 15px;
    }

    .header-actions .btn {
        padding: 9px 11px;
        font-size: 11px;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .dropzone {
        padding: 22px 15px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">
        <div class="brand">
            <div class="logo">L</div>

            <div>
                <h1>LeadFlow</h1>
                <p>Premium Lead Calling Workspace</p>
            </div>
        </div>

        <div class="header-actions">
            <button class="btn" onclick="clearAllData()">
                Clear
            </button>

            <button class="btn btn-primary" onclick="exportCSV()">
                ↓ Export CSV
            </button>
        </div>
    </header>

    <!-- DROPZONE -->
    <section class="dropzone" id="dropzone">

        <div class="drop-icon">↑</div>

        <h2>Import your leads</h2>

        <p>
            Drop a CSV or Excel file here, or select one from your computer.
        </p>

        <label class="file-label">
            + Choose File
            <input
                type="file"
                id="fileInput"
                accept=".csv,.xlsx,.xls"
            />
        </label>

    </section>

    <!-- STATS -->
    <section class="stats">

        <div class="stat">
            <div class="stat-label">Total Leads</div>
            <div class="stat-value" id="totalCount">0</div>
        </div>

        <div class="stat blue">
            <div class="stat-label">Called</div>
            <div class="stat-value" id="calledCount">0</div>
        </div>

        <div class="stat green">
            <div class="stat-label">Interested</div>
            <div class="stat-value" id="interestedCount">0</div>
        </div>

        <div class="stat red">
            <div class="stat-label">Not Interested</div>
            <div class="stat-value" id="notInterestedCount">0</div>
        </div>

        <div class="stat yellow">
            <div class="stat-label">Remaining</div>
            <div class="stat-value" id="remainingCount">0</div>
        </div>

    </section>

    <!-- TOOLBAR -->
    <div class="toolbar">

        <div class="search">
            <span>⌕</span>

            <input
                id="searchInput"
                type="text"
                placeholder="Search leads by name, phone, address..."
            />
        </div>

        <div class="filters">

            <button
                class="filter active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter"
                data-filter="not-called"
            >
                Not Called
            </button>

            <button
                class="filter"
                data-filter="called"
            >
                Called
            </button>

            <button
                class="filter"
                data-filter="interested"
            >
                Interested
            </button>

            <button
                class="filter"
                data-filter="not-interested"
            >
                Not Interested
            </button>

        </div>

    </div>

    <!-- TABLE -->
    <section class="table-wrap">

        <div class="table-scroll">

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Lead</th>
                        <th>Phone</th>
                        <th>Call</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="leadTable"></tbody>

            </table>

        </div>

        <div class="footer">

            <div id="resultInfo">
                No leads loaded
            </div>

            <div class="pagination" id="pagination"></div>

        </div>

    </section>

</div>

<div class="toast" id="toast"></div>

<script>

let leads = [];
let activeFilter = "all";
let currentPage = 1;
const pageSize = 50;


/* =========================================================
   STORAGE
========================================================= */

function saveData() {
    localStorage.setItem(
        "leadflow_leads",
        JSON.stringify(leads)
    );
}

function loadSavedData() {

    const saved = localStorage.getItem("leadflow_leads");

    if (!saved) return;

    try {
        leads = JSON.parse(saved);
        render();
        showToast("Previous lead list restored");
    } catch {
        localStorage.removeItem("leadflow_leads");
    }
}

loadSavedData();


/* =========================================================
   FILE IMPORT
========================================================= */

const fileInput = document.getElementById("fileInput");
const dropzone = document.getElementById("dropzone");

fileInput.addEventListener("change", e => {

    const file = e.target.files[0];

    if (file) {
        processFile(file);
    }

});

dropzone.addEventListener("dragover", e => {
    e.preventDefault();
    dropzone.classList.add("dragover");
});

dropzone.addEventListener("dragleave", () => {
    dropzone.classList.remove("dragover");
});

dropzone.addEventListener("drop", e => {

    e.preventDefault();

    dropzone.classList.remove("dragover");

    const file = e.dataTransfer.files[0];

    if (file) {
        processFile(file);
    }

});


function processFile(file) {

    const reader = new FileReader();

    reader.onload = function(e) {

        try {

            const workbook = XLSX.read(
                e.target.result,
                { type: "array" }
            );

            const sheet =
                workbook.Sheets[workbook.SheetNames[0]];

            const rows =
                XLSX.utils.sheet_to_json(sheet, {
                    defval: ""
                });

            importRows(rows);

        } catch(error) {

            console.error(error);

            showToast(
                "Couldn't read this file"
            );
        }
    };

    reader.readAsArrayBuffer(file);
}


/* =========================================================
   IMPORT NORMALIZATION
========================================================= */

function importRows(rows) {

    leads = rows.map((row, index) => {

        const keys = Object.keys(row);

        function findValue(possibleNames) {

            const key = keys.find(k => {

                const normalized =
                    k.toLowerCase()
                     .replace(/[^a-z0-9]/g, "");

                return possibleNames.some(name =>
                    normalized.includes(name)
                );
            });

            return key ? row[key] : "";
        }

        const name =
            findValue([
                "name",
                "businessname",
                "cafename",
                "company"
            ]);

        const phone =
            findValue([
                "phone",
                "phonenumber",
                "mobile",
                "contact"
            ]);

        const address =
            findValue([
                "address",
                "location"
            ]);

        return {

            id: crypto.randomUUID(),

            name:
                String(name || "Unnamed Lead"),

            phone:
                String(phone || ""),

            address:
                String(address || ""),

            status:
                "not-called",

            original:
                row
        };

    });

    saveData();

    currentPage = 1;

    render();

    showToast(
        `${leads.length} leads imported successfully`
    );
}


/* =========================================================
   FILTERING
========================================================= */

function getFilteredLeads() {

    const query =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();

    return leads.filter(lead => {

        const matchesFilter =
            activeFilter === "all" ||
            lead.status === activeFilter;

        const searchable =
            `${lead.name}
             ${lead.phone}
             ${lead.address}`
             .toLowerCase();

        const matchesSearch =
            !query ||
            searchable.includes(query);

        return matchesFilter && matchesSearch;

    });

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    updateStats();

    const filtered =
        getFilteredLeads();

    const totalPages =
        Math.max(
            1,
            Math.ceil(filtered.length / pageSize)
        );

    if (currentPage > totalPages) {
        currentPage = totalPages;
    }

    const start =
        (currentPage - 1) * pageSize;

    const pageLeads =
        filtered.slice(
            start,
            start + pageSize
        );

    const tbody =
        document.getElementById("leadTable");

    tbody.innerHTML = "";

    if (!pageLeads.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="5">
                    <div class="empty">
                        <div class="empty-icon">◎</div>
                        <div>No leads found</div>
                    </div>
                </td>
            </tr>
        `;

    } else {

        pageLeads.forEach((lead, index) => {

            const row =
                document.createElement("tr");

            row.innerHTML = `

                <td>
                    ${start + index + 1}
                </td>

                <td>
                    <div class="lead-name">
                        ${escapeHTML(lead.name)}
                    </div>

                    ${
                        lead.address
                        ?
                        `<div class="lead-meta">
                            ${escapeHTML(lead.address)}
                        </div>`
                        :
                        ""
                    }
                </td>

                <td>
                    <div class="phone">
                        ${escapeHTML(lead.phone)}
                    </div>
                </td>

                <td>

                    ${
                        lead.phone
                        ?
                        `<button
                            class="call-btn"
                            onclick="callLead('${escapeAttribute(lead.phone)}')"
                        >
                            ☎ Call
                        </button>`
                        :
                        `<span style="color:#555">
                            —
                        </span>`
                    }

                </td>

                <td>

                    <select
                        class="status-select ${lead.status}"
                        onchange="changeStatus(
                            '${lead.id}',
                            this.value
                        )"
                    >

                        <option
                            value="not-called"
                            ${lead.status === "not-called" ? "selected" : ""}
                        >
                            Not Called
                        </option>

                        <option
                            value="called"
                            ${lead.status === "called" ? "selected" : ""}
                        >
                            Called
                        </option>

                        <option
                            value="interested"
                            ${lead.status === "interested" ? "selected" : ""}
                        >
                            Interested
                        </option>

                        <option
                            value="not-interested"
                            ${lead.status === "not-interested" ? "selected" : ""}
                        >
                            Not Interested
                        </option>

                    </select>

                </td>
            `;

            tbody.appendChild(row);

        });

    }

    document.getElementById("resultInfo").textContent =
        `${filtered.length} lead${filtered.length === 1 ? "" : "s"} • Page ${currentPage} of ${totalPages}`;

    renderPagination(totalPages);
}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

    const total =
        leads.length;

    const called =
        leads.filter(
            x =>
                x.status === "called" ||
                x.status === "interested" ||
                x.status === "not-interested"
        ).length;

    const interested =
        leads.filter(
            x => x.status === "interested"
        ).length;

    const notInterested =
        leads.filter(
            x => x.status === "not-interested"
        ).length;

    const remaining =
        total - called;

    document.getElementById("totalCount").textContent =
        total;

    document.getElementById("calledCount").textContent =
        called;

    document.getElementById("interestedCount").textContent =
        interested;

    document.getElementById("notInterestedCount").textContent =
        notInterested;

    document.getElementById("remainingCount").textContent =
        remaining;
}


/* =========================================================
   STATUS
========================================================= */

function changeStatus(id, status) {

    const lead =
        leads.find(x => x.id === id);

    if (!lead) return;

    lead.status = status;

    saveData();

    render();

    if (status === "interested") {

        showToast(
            "🔥 Lead marked as interested"
        );

    } else if (status === "called") {

        showToast(
            "Lead marked as called"
        );

    }

}


/* =========================================================
   CALL
========================================================= */

function callLead(phone) {

    const lead =
        leads.find(
            x => x.phone === phone
        );

    if (lead && lead.status === "not-called") {

        lead.status = "called";

        saveData();

    }

    window.location.href =
        `tel:${phone}`;

    render();

}


/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        () => {

            currentPage = 1;

            render();

        }
    );


/* =========================================================
   FILTER BUTTONS
========================================================= */

document
    .querySelectorAll(".filter")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".filter")
                    .forEach(b =>
                        b.classList.remove("active")
                    );

                button.classList.add("active");

                activeFilter =
                    button.dataset.filter;

                currentPage = 1;

                render();

            }
        );

    });


/* =========================================================
   PAGINATION
========================================================= */

function renderPagination(totalPages) {

    const container =
        document.getElementById("pagination");

    container.innerHTML = "";

    if (totalPages <= 1)
        return;

    const prev =
        document.createElement("button");

    prev.className = "page-btn";

    prev.textContent = "‹";

    prev.disabled =
        currentPage === 1;

    prev.onclick = () => {

        currentPage--;

        render();

    };

    container.appendChild(prev);


    const maxButtons = 5;

    let start =
        Math.max(
            1,
            currentPage - 2
        );

    let end =
        Math.min(
            totalPages,
            start + maxButtons - 1
        );

    if (end - start < maxButtons - 1) {

        start =
            Math.max(
                1,
                end - maxButtons + 1
            );

    }

    for (
        let i = start;
        i <= end;
        i++
    ) {

        const button =
            document.createElement("button");

        button.className =
            "page-btn" +
            (i === currentPage
                ? " active"
                : "");

        button.textContent = i;

        button.onclick = () => {

            currentPage = i;

            render();

        };

        container.appendChild(button);

    }


    const next =
        document.createElement("button");

    next.className =
        "page-btn";

    next.textContent = "›";

    next.disabled =
        currentPage === totalPages;

    next.onclick = () => {

        currentPage++;

        render();

    };

    container.appendChild(next);

}


/* =========================================================
   EXPORT
========================================================= */

function exportCSV() {

    if (!leads.length) {

        showToast(
            "No leads to export"
        );

        return;

    }

    const data =
        leads.map(lead => ({

            Name:
                lead.name,

            Phone:
                lead.phone,

            Address:
                lead.address,

            Status:
                formatStatus(lead.status)

        }));

    const worksheet =
        XLSX.utils.json_to_sheet(data);

    const workbook =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Leads"
    );

    XLSX.writeFile(
        workbook,
        "leadflow-updated-leads.xlsx"
    );

    showToast(
        "Lead list exported"
    );

}


/* =========================================================
   CLEAR
========================================================= */

function clearAllData() {

    if (!leads.length)
        return;

    const confirmed =
        confirm(
            "Clear all imported leads and saved progress?"
        );

    if (!confirmed)
        return;

    leads = [];

    localStorage.removeItem(
        "leadflow_leads"
    );

    render();

    showToast(
        "All lead data cleared"
    );

}


/* =========================================================
   HELPERS
========================================================= */

function formatStatus(status) {

    const names = {

        "not-called":
            "Not Called",

        "called":
            "Called",

        "interested":
            "Interested",

        "not-interested":
            "Not Interested"

    };

    return names[status] || status;
}


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

    return String(value)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");
}


function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(
        window.__toastTimer
    );

    window.__toastTimer =
        setTimeout(
            () =>
                toast.classList.remove("show"),
            2200
        );

}


/* Initial render */
render();

</script>
